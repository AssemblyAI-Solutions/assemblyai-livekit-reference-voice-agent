name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check --output-format=github .
      - run: uvx ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      # The tests talk to the LLM Gateway. Without an ASSEMBLYAI_API_KEY repository secret
      # they're skipped, and this job only checks that the project installs and imports.
      - run: uv run python -c "import agent"
        working-directory: src
      - run: uv run pytest -v
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
